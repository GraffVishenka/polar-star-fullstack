        '501': {$ref: '#/components/responses/NotImplemented'}
    post:
      tags: [Settings]
      operationId: createHoliday
      summary: Добавление праздника
      description: |-
        CAL-1: дата уникальна (повтор → `409`).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayCreateRequest'}
      responses:
        '201':
          $ref: '#/components/responses/CreatedHoliday'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/admin/holidays/{id}:
    delete:
      tags: [Settings]
      operationId: deleteHoliday
      summary: Удаление праздника
      description: ADMIN.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/push/public-key:
