openapi: 3.0.3
info:
  title: Заявки · База знаний · Оборудование — API
  version: 0.1.0
  description: |
    Единый контракт внутреннего приложения: заявки, база знаний, оборудование,
    авторизация и администрирование (PLAN.md §3.13).

    ## Общие правила
    - Все даты (DATE) передаются строкой `YYYY-MM-DD`, даты-время — RFC 3339 с offset.
      Дедлайны, «сегодня» и просрочка считаются сервером в часовом поясе приложения
      (`timezone`, по умолчанию `Asia/Yekaterinburg`); клиент только отображает (NFR-7).
    - Ошибки всегда имеют формат `{"code","message","details","request_id"}`;
      `details` — объект (может быть пустым). Код `request_id` совпадает с заголовком
      `X-Request-ID` и пишется в JSON-логи (NFR-4).
    - Авторизация: `Authorization: Bearer <access_token>`. Access-токен живёт 15 минут.
      Refresh-токен передаётся только в httpOnly cookie `refresh_token` (path=/api/auth,
      SameSite=Lax, 7 дней) и в теле ответа не появляется (AUTH-2).
    - Ограничение видимости заявок по зданию действует только на заявки: USER получает
      `404` вместо `403` для чужих заявок, чтобы не раскрывать их существование (TICKET-7).
    - У пользователя с `must_change_password=true` все маршруты, кроме
      `GET /api/auth/me`, `POST /api/auth/password`, `POST /api/auth/logout`,
      отвечают `428 PASSWORD_CHANGE_REQUIRED` (AUTH-4).
    - Эндпоинты, помеченные `501`, — замороженные заглушки: маршрут и права уже
      зафиксированы, реализация появится в следующих блоках.
servers:
  - url: http://localhost:8080
    description: Локальный API (docker compose)
  - url: /
    description: Текущий origin (reverse proxy, HTTPS)
tags:
  - name: Auth
    description: Вход, ротация сессии, профиль и смена пароля (AUTH-1..AUTH-9)
  - name: Public
    description: Публичный периметр для анонимных посетителей (PUB-1..PUB-7)
  - name: Tickets
    description: Заявки для авторизованных (TICKET-1..TICKET-16)
  - name: Files
    description: Загрузка и выдача медиа (Б3)
  - name: KB
    description: База знаний (KB-1..KB-8)
  - name: Users
    description: Пользователи и назначение исполнителей (AUTH-4..AUTH-9)
  - name: Stats
    description: Статистика сотрудников (STATS-1..STATS-4)
  - name: Buildings
    description: Здания и склады (EQ-1, EQ-6)
  - name: Equipment
    description: Учёт оборудования (EQ-2..EQ-8)
  - name: Settings
    description: Настройки, справочники и праздники (CAL-1..CAL-4)
  - name: Push
    description: Web Push подписки (NOTIF-1..NOTIF-7)
  - name: Trash
    description: Корзина и восстановление (TRASH-1..TRASH-5)
  - name: System
    description: Health-check и документация (NFR-4)
security: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по логину и паролю
      description: |
        AUTH-1: argon2id-проверка пароля. Неверная пара и заблокированный аккаунт дают
        одинаковый `401 INVALID_CREDENTIALS` без раскрытия существования логина.
        AUTH-3: 10 неудачных попыток на пару login+IP за 10 минут → `429` + `Retry-After`.
        При успехе в Set-Cookie кладётся refresh-токен (httpOnly, SameSite=Lax,
        path=/api/auth, 7 дней), в теле — access-токен и профиль.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          $ref: '#/components/responses/OkSession'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Ротация сессии по refresh-cookie
      description: |
        AUTH-2: refresh-токен берётся из cookie. При каждом refresh старый токен
        отзывается, выпускается новый (ротация). Повторное использование старого
        токена → `401` и отзыв всей цепочки; клиент должен войти заново.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          $ref: '#/components/responses/OkSession'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выход из текущей сессии
      description: Отзывает refresh-токен из cookie и очищает cookie. Идемпотентно; доступно при `must_change_password`.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500': {$ref: '#/components/responses/InternalError'}
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Профиль текущего пользователя
      description: AUTH-6 — пользователь перечитывается из БД; заблокированный аккаунт получает `401`.
      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkUser'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Смена своего пароля
      description: |
        AUTH-5: требуются текущий пароль и новый (8..128 символов). После смены флаг
        `must_change_password` снимается, прочие refresh-сессии отзываются.
        Доступно при `must_change_password` (AUTH-4).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/public/buildings:
    get:
      tags: [Public]
      operationId: listPublicBuildings
      summary: Активные здания со счётчиками заявок
      description: |
        TICKET-6 / PUB-1: только активные здания с названием и счётчиками `new`,
        `in_progress`, `deferred`; завершённые не учитываются. Склады и пользователи
        не отдаются. Лимит — 120 запросов / 10 минут на IP (AUTH-3).
      responses:
        '200':
          $ref: '#/components/responses/OkPublicBuildings'
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/tickets:
    get:
      tags: [Public]
      operationId: listPublicTickets
      summary: Публичный дашборд здания или сводка по всем зданиям
      description: |
        TICKET-5 / PUB-2 / PUB-4: карточки без `description`, комментариев и файлов.
        Группировка по 3 статусам (`new`, `in_progress`, `deferred`), `done` отсутствует.
        Без `building_id` — сводка по всем активным зданиям (только чтение).
      parameters:
        - name: building_id
          in: query
          required: false
          description: Активное здание; отсутствует — сводка по всем зданиям.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          $ref: '#/components/responses/OkPublicTickets'
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    post:
      tags: [Public]
      operationId: createPublicTicket
      summary: Создание заявки анонимным посетителем
      description: |
        TICKET-4 / TICKET-13 / PUB-5: `building_id` обязателен; неактивное или
        несуществующее здание → `404`. Дедлайн считается сервером как N рабочих дней
        (TICKET-3). В ответе один раз выдаётcs `access_token` для бессрочной ссылки
        `/t/{token}`; в БД хранится только SHA-256.
        Лимит — 5 запросов / 10 минут на IP (AUTH-3).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicTicketCreateRequest'}
      responses:
        '201':
          $ref: '#/components/responses/CreatedPublicTicket'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/tickets/{token}:
    get:
      tags: [Public]
      operationId: getPublicTicket
      summary: Карточка заявки по токену доступа
      description: |
        TICKET-13 / PUB-6: доступна только эта заявка. Чужой/битый токен → `404`
        (существование не раскрывается). Токен бессрочный.
      parameters:
        - $ref: '#/components/parameters/TokenPath'
      responses:
        '200':
          $ref: '#/components/responses/OkPublicTicket'
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/tickets/{token}/comments:
    post:
      tags: [Public]
      operationId: createPublicComment
      summary: Комментарий анонима к своей заявке
      description: |
        TICKET-14 / PUB-6: текст до 3000 символов (может быть пустым при наличии
        вложения), до 5 вложений. Автор — имя анонима из заявки.
      parameters:
        - $ref: '#/components/parameters/TokenPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentCreateRequest'}
      responses:
        '201':
          $ref: '#/components/responses/CreatedComment'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/tickets/{token}/export.docx:
    get:
      tags: [Public]
      operationId: exportPublicTicketDocx
      summary: Word-заявка по токену
      description: |-
        DOC-1: `.docx` по шаблону, `Content-Disposition: attachment`, `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/TokenPath'
      responses:
        '200':
          $ref: '#/components/responses/BinaryDocx'
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/files:
    post:
      tags: [Public]
      operationId: uploadPublicFile
      summary: Загрузка вложения анонимным комментарием
      description: |
        TICKET-14 / PUB-6 / Б3 (аддитивное расширение контракта): аноним может
        приложить файл к комментарию своей заявки. Доступ проверяется по бессрочному
        `access_token` заявки; `scope` всегда `ticket`, автор загрузки анонимный
        (`uploader_id = null`, `is_anonymous = true`). Файл привязывается к комментарию
        при его создании (`POST /api/public/tickets/{token}/comments`). Те же лимиты,
        что у авторизованной загрузки: фото ≤ 10 МБ, видео ≤ 200 МБ, MIME по сигнатуре
        (`415` — недопустимый формат, `413` — превышен размер). Rate limit — как у
        публичного создания заявки: 5 запросов / 10 минут на IP (AUTH-3).
      parameters:
        - name: token
          in: query
          required: true
          description: Токен анонимной заявки.
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          $ref: '#/components/responses/CreatedFile'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/public/files/{id}:
    get:
      tags: [Public]
      operationId: getPublicFile
      summary: Файл заявки по токену доступа
      description: |
        TICKET-13 / Б3: доступ только к файлу своей заявки по токену. Поддерживается
        Range (`206 Partial Content`) для видео. Заголовки `Content-Disposition`,
        `Accept-Ranges`, `nosniff`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: token
          in: query
          required: true
          description: Токен анонимной заявки.
          schema: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/BinaryFile'
        '206':
          $ref: '#/components/responses/BinaryFileRange'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/kb/tree:
    get:
      tags: [Public]
      operationId: getPublicKbTree
      summary: Публичное дерево базы знаний
      description: |
        KB-7 / KB-8 / PUB-7: только публичные корневые разделы и их потомки, сортировка
        `sort_order, title`. Дерево отдаётся одним запросом.
      responses:
        '200':
          $ref: '#/components/responses/OkKbTree'
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/public/kb/nodes/{id}:
    get:
      tags: [Public]
      operationId: getPublicKbNode
      summary: Публичная статья базы знаний
      description: |-
        KB-7: прямой запрос скрытого узла → `404`. Медиа внутри HTML выдаются через `/api/public/files`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkKbNode'
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Список заявок с фильтрами и пагинацией
      description: |
        TICKET-7 / TICKET-15 / TICKET-16: USER видит только заявки своего здания
        (фильтр `building_id` принудительно равен его зданию); ADMIN видит все.
        Фильтры: мультивыбор статусов, исполнитель, вид проблемы, здание, диапазон дат,
        поиск по заявителю/кабинету. Пагинация серверная, `size` ≤ 100, ответ содержит `total`.
        `is_overdue` считает сервер в `timezone`.
      security: [{bearerAuth: []}]
      parameters:
        - name: status
          in: query
          required: false
          description: Мультивыбор статусов.
          schema:
            type: array
            items: {$ref: '#/components/schemas/TicketStatus'}
          style: form
          explode: true
        - name: executor_id
          in: query
          description: Исполнитель.
          schema: {type: integer, format: int64, minimum: 1}
        - name: problem_type_id
          in: query
          description: Вид проблемы.
          schema: {type: integer, format: int64, minimum: 1}
        - name: building_id
          in: query
          description: Здание; у USER игнорируется и подменяется его зданием.
          schema: {type: integer, format: int64, minimum: 1}
        - name: date_from
          in: query
          description: Начало периода по `created_at` (DATE в timezone).
          schema: {type: string, format: date}
        - name: date_to
          in: query
          description: Конец периода по `created_at` (включительно).
          schema: {type: string, format: date}
        - name: search
          in: query
          description: Поиск по `applicant_name` и `cabinet`.
          schema: {type: string, maxLength: 120}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, deadline], default: created_at}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/OkTicketList'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Создание заявки авторизованным пользователем
      description: |
        TICKET-2 / TICKET-3 / TICKET-8: здание обязательно. USER создаёт только в своём
        здании (иначе `404`), ADMIN — в любом (неактивное → `404`). Дедлайн считается
        сервером (N рабочих дней); исполнитель по умолчанию пуст.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketCreateRequest'}
      responses:
        '201':
          $ref: '#/components/responses/OkTicket'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/tickets/{id}:
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Карточка заявки
      description: |-
        TICKET-7: USER — только заявка своего здания (иначе `404`), ADMIN — любая.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkTicket'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Изменение заявки
      description: |
        TICKET-8..TICKET-11:
        - USER назначает только себя, иначе `403 ASSIGN_OTHER_USER`; ADMIN — USER из
          здания заявки или ADMIN (`422 EXECUTOR_WRONG_BUILDING`), либо снимает исполнителя.
        - Статус меняет USER своего здания и ADMIN; `done` проставляет `completed_at`,
          выход из `done` — обнуляет (TICKET-10).
        - Дедлайн и здание меняет только ADMIN (TICKET-9). При смене здания USER-исполнитель
          из другого здания сбрасывается, ответ содержит `executor_reset: true`;
          ADMIN-исполнитель сохраняется.
        - Правка полей USER'ом — только если он исполнитель (`403 NOT_EXECUTOR`).
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketUpdateRequest'}
      responses:
        '200':
          $ref: '#/components/responses/OkTicketUpdate'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
    delete:
      tags: [Tickets]
