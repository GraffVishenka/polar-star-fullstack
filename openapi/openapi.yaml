    OkTrashRestore:
      description: Элемент восстановлен.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TrashRestoreResponse'}
    BinaryDocx:
      description: Word-документ заявки.
      headers:
        Content-Disposition:
          description: '`attachment; filename="ticket_{id}.docx"`'
          schema: {type: string}
        Cache-Control:
          description: '`no-store`'
          schema: {type: string}
      content:
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema: {type: string, format: binary}
    BinaryXlsx:
      description: Excel-документ.
      headers:
        Content-Disposition:
          description: '`attachment; filename="..."`'
          schema: {type: string}
        Cache-Control:
          description: '`no-store`'
          schema: {type: string}
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: {type: string, format: binary}
    BinaryFile:
      description: Содержимое файла; MIME соответствует сохранённому типу.
      headers:
        Content-Disposition:
          description: '`inline` или `attachment` в зависимости от типа файла.'
          schema: {type: string}
        Accept-Ranges:
          description: '`bytes`'
          schema: {type: string}
        X-Content-Type-Options:
          description: '`nosniff`'
          schema: {type: string}
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    BinaryFileRange:
      description: Частичное содержимое файла (Range).
      headers:
        Content-Range:
          schema: {type: string}
        Accept-Ranges:
          schema: {type: string}
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    BadRequest:
      description: Некорректный запрос или тело.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Требуется авторизация (или недействительная сессия).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Недостаточно прав.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Ресурс не найден (в том числе чужая заявка — TICKET-7).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Конфликт состояния (409).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Ошибка валидации (422); `details` содержит поля.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PasswordChangeRequired:
      description: Требуется смена временного пароля (428, AUTH-4).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Превышен лимит запросов (429, AUTH-3).
      headers:
        Retry-After:
          description: Секунды до следующей возможной попытки.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Превышен допустимый размер (413).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Недопустимый тип файла (415, Б3).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Внутренняя ошибка сервера (500).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotImplemented:
      description: |
        Маршрут заморожен контрактом, реализация появится в следующих блоках (Б2..Б12).
        Права (401/403/428) проверяются уже сейчас.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, details, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое сообщение на русском.
          example: Заявка не найдена
        details:
          type: object
          additionalProperties: true
          description: Машиночитаемые детали (обычно пустой объект).
          example: {}
        request_id:
          type: string
          description: Идентификатор запроса из заголовка `X-Request-ID` (NFR-4).
          example: 7f3c2a9d4b1e4c8fa5d6e7f8091a2b3c
    ErrorCode:
      type: string
      description: Типизированный код ошибки.
      enum:
        - VALIDATION_ERROR
        - INVALID_JSON
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - NOT_IMPLEMENTED
        - SERVICE_UNAVAILABLE
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - PASSWORD_CHANGE_REQUIRED
        - INVALID_CURRENT_PASSWORD
        - BUILDING_REQUIRED_FOR_USER
        - BUILDING_INACTIVE
        - BUILDING_NOT_ASSIGNED
        - CANNOT_MODIFY_SELF
        - LAST_ADMIN
        - DUPLICATE_LOGIN
        - ASSIGN_OTHER_USER
        - EXECUTOR_WRONG_BUILDING
        - NOT_EXECUTOR
        - INVALID_STATUS
        - CYCLE_DETECTED
        - INVALID_MEDIA_REF
        - SAME_WAREHOUSE
        - DUPLICATE_REGISTRATION_NUMBER
        - WAREHOUSE_NOT_EMPTY
        - BUILDING_IN_USE
    Role:
      type: string
      enum: [USER, ADMIN]
    TicketStatus:
      type: string
      description: |
        Коды статусов фиксированы (TICKET-1); названия и цвета настраиваются и
        отдаются в `status_label` / `status_color`.
      enum: [new, in_progress, deferred, done]
    TrashType:
      type: string
      enum: [ticket, kb, equipment]
    Workday:
      type: integer
      description: День недели ISO-8601 (1=Пн … 7=Вс).
      enum: [1, 2, 3, 4, 5, 6, 7]
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 64
          example: admin
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    AuthSession:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT access-токен (HS256, TTL 15 минут).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Время жизни access-токена в секундах.
          example: 900
        user:
          $ref: '#/components/schemas/User'
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    User:
      type: object
      required:
        [id, login, full_name, role, is_active, must_change_password, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        login: {type: string, maxLength: 64}
        full_name: {type: string, maxLength: 200}
        role: {$ref: '#/components/schemas/Role'}
        building_id:
          type: integer
          format: int64
          nullable: true
          description: Здание USER; у ADMIN всегда null.
        building_name:
          type: string
          nullable: true
        is_active: {type: boolean}
        must_change_password:
          type: boolean
          description: true — до смены пароля прочие маршруты отвечают 428.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Health:
      type: object
      required: [status, app, version, time, uptime_seconds]
      properties:
        status: {type: string, enum: [ok]}
        app: {type: string, example: polar-star-service}
        version: {type: string, example: 0.1.0}
        time: {type: string, format: date-time}
        uptime_seconds: {type: integer, format: int64}
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, down]
    Building:
      type: object
      required: [id, name, is_active, created_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, maxLength: 200}
        address:
          type: string
          maxLength: 500
          nullable: true
        is_active:
          type: boolean
          description: Неактивное здание скрыто из публичного выбора и форм, но остаётся в истории (EQ-6).
        created_at: {type: string, format: date-time}
    BuildingCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        address:
          type: string
          maxLength: 500
          nullable: true
    BuildingUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        address:
          type: string
          maxLength: 500
          nullable: true
        is_active: {type: boolean}
    PublicBuilding:
      type: object
      required: [id, name, counts]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        counts:
          type: object
          required: [new, in_progress, deferred]
          properties:
            new: {type: integer, minimum: 0}
            in_progress: {type: integer, minimum: 0}
            deferred: {type: integer, minimum: 0}
    Warehouse:
      type: object
      required: [id, building_id, name, created_at]
      properties:
        id: {type: integer, format: int64}
        building_id: {type: integer, format: int64}
        building_name: {type: string}
        name: {type: string, maxLength: 200}
        created_at: {type: string, format: date-time}
    WarehouseCreateRequest:
      type: object
      required: [building_id, name]
      properties:
        building_id: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 200}
    WarehouseUpdateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    PublicTicketCard:
      type: object
      description: Поля публичной карточки строго по TICKET-5 (без description и вложений).
      required:
        [id, building_id, building_name, applicant_name, cabinet, problem_type_name,
         status, status_label, status_color, created_at]
      properties:
        id: {type: integer, format: int64}
        building_id: {type: integer, format: int64}
        building_name: {type: string}
        applicant_name: {type: string, maxLength: 120}
        cabinet: {type: string, maxLength: 32}
        problem_type_name: {type: string}
        status: {$ref: '#/components/schemas/TicketStatus'}
        status_label: {type: string}
        status_color: {type: string, example: '#1677ff'}
        deadline:
          type: string
          format: date
          nullable: true
        executor_name:
          type: string
          nullable: true
        created_at: {type: string, format: date-time}
    PublicTicketsResponse:
      type: object
      required: [items]
      properties:
        building_id:
          type: integer
          format: int64
          nullable: true
          description: null — сводка по всем активным зданиям.
        building_name:
          type: string
          nullable: true
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicTicketCard'}
    PublicTicketDetail:
      allOf:
        - $ref: '#/components/schemas/PublicTicketCard'
        - type: object
          required: [description, comments]
          properties:
            description: |-
              {type: string, maxLength: 5000}
            completed_at:
              type: string
              format: date-time
              nullable: true
            comments:
              type: array
              description: Комментарии заявки (плоский список).
              items: {$ref: '#/components/schemas/TicketComment'}
    PublicTicketCreateRequest:
      type: object
      required: [building_id, applicant_name, cabinet, problem_type_id, description]
      properties:
        building_id:
          type: integer
          format: int64
          minimum: 1
          description: Обязателен (TICKET-4); неактивное/несуществующее → 404.
        applicant_name: {type: string, minLength: 1, maxLength: 120}
        cabinet: {type: string, minLength: 1, maxLength: 32}
        problem_type_id: {type: integer, format: int64, minimum: 1}
        description: |-
          {type: string, minLength: 1, maxLength: 5000}
    PublicTicketCreateResponse:
      type: object
      required: [ticket, access_token, access_url]
      properties:
        ticket:
          $ref: '#/components/schemas/PublicTicketDetail'
        access_token:
          type: string
          description: Токен доступа (32 случайных байта base64url); в БД — SHA-256, выдаётся один раз.
        access_url:
          type: string
          description: Относительная ссылка на карточку.
          example: /t/7Kf3...
    Ticket:
      type: object
      required:
        [id, building_id, building_name, applicant_name, cabinet, problem_type_id,
         problem_type_name, description, status, status_label, status_color, is_overdue,
         created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        building_id: {type: integer, format: int64}
        building_name: {type: string}
        applicant_name: {type: string, maxLength: 120}
        cabinet: {type: string, maxLength: 32}
        problem_type_id: {type: integer, format: int64}
        problem_type_name: {type: string}
        description: |-
          {type: string, maxLength: 5000}
        deadline:
          type: string
          format: date
          nullable: true
          description: Считается сервером по рабочему календарю (TICKET-3).
        executor_id:
          type: integer
          format: int64
          nullable: true
        executor_name:
          type: string
          nullable: true
        status: {$ref: '#/components/schemas/TicketStatus'}
        status_label: {type: string}
        status_color: {type: string, example: '#1677ff'}
        is_overdue:
          type: boolean
          description: Рассчитывается сервером в timezone (TICKET-16).
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TicketListItem:
      type: object
      required:
        [id, building_id, building_name, applicant_name, cabinet, problem_type_name,
         status, status_label, status_color, is_overdue, created_at]
      properties:
        id: {type: integer, format: int64}
        building_id: {type: integer, format: int64}
        building_name: {type: string}
        applicant_name: {type: string, maxLength: 120}
        cabinet: {type: string, maxLength: 32}
        problem_type_name: {type: string}
        status: {$ref: '#/components/schemas/TicketStatus'}
        status_label: {type: string}
        status_color: {type: string}
        deadline:
          type: string
          format: date
          nullable: true
        executor_id:
          type: integer
          format: int64
          nullable: true
        executor_name:
          type: string
          nullable: true
        is_overdue: {type: boolean}
        created_at: {type: string, format: date-time}
    TicketListResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TicketListItem'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    TicketCreateRequest:
      type: object
      required: [applicant_name, cabinet, problem_type_id, description]
      properties:
        building_id:
          type: integer
          format: int64
          nullable: true
          description: Для USER игнорируется и берётся его здание; для ADMIN обязателен.
        applicant_name: {type: string, minLength: 1, maxLength: 120}
        cabinet: {type: string, minLength: 1, maxLength: 32}
        problem_type_id: {type: integer, format: int64, minimum: 1}
        description: |-
          {type: string, minLength: 1, maxLength: 5000}
        executor_id:
          type: integer
          format: int64
          nullable: true
          description: Необязательное назначение при создании (ADMIN — USER здания заявки или ADMIN).
    TicketUpdateRequest:
      type: object
      description: |
        Частичное обновление. Поля `deadline` и `building_id` принимает только ADMIN
        (TICKET-9); `executor_id: null` снимает исполнителя (TICKET-8).
      properties:
        applicant_name: {type: string, minLength: 1, maxLength: 120}
        cabinet: {type: string, minLength: 1, maxLength: 32}
        problem_type_id: {type: integer, format: int64, minimum: 1}
        description: |-
          {type: string, minLength: 1, maxLength: 5000}
        status: {$ref: '#/components/schemas/TicketStatus'}
        executor_id:
          type: integer
          format: int64
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        building_id:
          type: integer
          format: int64
          nullable: true
    TicketUpdateResponse:
      type: object
      required: [ticket, executor_reset]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        executor_reset:
          type: boolean
          description: true, если при смене здания USER-исполнитель из другого здания был сброшен (TICKET-9).
    FileInfo:
      type: object
      required: [id, filename, mime_type, size, scope, url, created_at]
      properties:
        id: {type: integer, format: int64}
        filename: {type: string}
        mime_type: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        scope:
          type: string
          enum: [ticket, kb]
        url:
          type: string
          description: |
            Ссылка на файл: `/api/files/{id}` для авторизованных или
            `/api/public/files/{id}?token=...` для публичной заявки.
        created_at: {type: string, format: date-time}
    CommentCreateRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 3000
          description: Может быть пустым при наличии вложений (TICKET-14).
        file_ids:
          type: array
          maxItems: 5
          items: {type: integer, format: int64}
    TicketComment:
      type: object
      required: [id, ticket_id, author_name, text, created_at, files]
      properties:
        id: {type: integer, format: int64}
        ticket_id: {type: integer, format: int64}
        author_user_id:
          type: integer
          format: int64
          nullable: true
        author_name: {type: string}
        text: {type: string, maxLength: 3000}
        created_at: {type: string, format: date-time}
        files:
          type: array
          items: {$ref: '#/components/schemas/FileInfo'}
    CommentListResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TicketComment'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    KbNode:
      type: object
      required:
        [id, title, content_html, sort_order, is_hidden_for_anon, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        title: {type: string, minLength: 1, maxLength: 200}
        content_html:
          type: string
          maxLength: 100000
          description: Санитизированный HTML (KB-4).
        parent_id:
          type: integer
          format: int64
          nullable: true
        sort_order: {type: integer}
        is_hidden_for_anon:
          type: boolean
          description: Скрыт ли корневой раздел от анонимов (у потомков наследуется).
        breadcrumbs:
          type: array
          description: Путь от корня до узла (для навигации).
          items:
            type: object
            required: [id, title]
            properties:
              id: {type: integer, format: int64}
              title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    KbTreeNode:
      type: object
      required: [id, title, sort_order, is_hidden_for_anon, children]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        parent_id:
          type: integer
          format: int64
          nullable: true
        sort_order: {type: integer}
        is_hidden_for_anon: {type: boolean}
        children:
          type: array
          items: {$ref: '#/components/schemas/KbTreeNode'}
    KbNodeCreateRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        content_html: {type: string, maxLength: 100000, default: ''}
        parent_id:
          type: integer
          format: int64
          nullable: true
        sort_order: {type: integer}
        is_hidden_for_anon:
          type: boolean
          description: Допустимо только для корневых узлов; для потомков игнорируется.
    KbNodeUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        content_html: {type: string, maxLength: 100000}
        parent_id:
          type: integer
          format: int64
          nullable: true
        sort_order: {type: integer}
    KbMoveRequest:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: null — переместить в корень.
        before_node_id:
          type: integer
          format: int64
          nullable: true
          description: Встать перед указанным узлом; null — в конец.
    KbVisibilityRequest:
      type: object
      required: [is_hidden_for_anon]
      properties:
        is_hidden_for_anon: {type: boolean}
    KbDeleteResponse:
      type: object
      required: [deleted_id, deleted_descendants]
      properties:
        deleted_id: {type: integer, format: int64}
        deleted_descendants:
          type: integer
          minimum: 0
          description: Число дочерних узлов, удалённых каскадно (TRASH-5 — не восстанавливаются).
    AssignableUser:
      type: object
      required: [id, login, full_name, role]
      properties:
        id: {type: integer, format: int64}
        login: {type: string}
        full_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        building_id:
          type: integer
          format: int64
          nullable: true
        building_name:
          type: string
          nullable: true
    UserCreateRequest:
      type: object
      required: [login, full_name, role, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
        full_name: {type: string, minLength: 1, maxLength: 200}
        role: {$ref: '#/components/schemas/Role'}
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: Временный пароль; пользователь обязан сменить его (AUTH-4).
        building_id:
          type: integer
          format: int64
          nullable: true
          description: Обязателен для USER (`422 BUILDING_REQUIRED_FOR_USER`), для ADMIN — null.
    UserUpdateRequest:
      type: object
      properties:
        full_name: {type: string, minLength: 1, maxLength: 200}
        role: {$ref: '#/components/schemas/Role'}
        building_id:
          type: integer
          format: int64
          nullable: true
          description: null очищает закрепление; ADMIN→USER без здания → 422 (AUTH-8).
        is_active:
          type: boolean
          description: false блокирует аккаунт и отзывает refresh-токены (AUTH-6).
    UserListResponse:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    AdminPasswordResetRequest:
      type: object
      required: [new_password]
      properties:
        new_password: {type: string, minLength: 8, maxLength: 128, format: password}
    StatsPeriod:
      type: object
      properties:
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
    StatsProblemType:
      type: object
      required: [name, count]
      properties:
        problem_type_id:
          type: integer
          format: int64
          nullable: true
        name: {type: string}
        count: {type: integer, minimum: 0}
    StatsMonth:
      type: object
      required: [month, count]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'
        count: {type: integer, minimum: 0}
    StatsResponse:
      type: object
      required:
        [user_id, login, full_name, period, total_done, done_in_period,
         avg_resolution_hours, median_resolution_hours, on_time_percent,
         overdue_count, by_problem_type, by_month]
      properties:
        user_id: {type: integer, format: int64}
        login: {type: string}
        full_name: {type: string}
        building_id:
          type: integer
          format: int64
          nullable: true
        building_name:
          type: string
          nullable: true
        period: {$ref: '#/components/schemas/StatsPeriod'}
        total_done:
          type: integer
          minimum: 0
          description: Всего завершённых заявок (без корзины).
        done_in_period: {type: integer, minimum: 0}
        avg_resolution_hours:
          type: number
          format: double
          nullable: true
          description: Среднее время выполнения в часах, 0.1 (STATS-2).
        median_resolution_hours:
          type: number
          format: double
          nullable: true
        on_time_percent:
          type: number
          format: double
          nullable: true
          description: null, если завершённых заявок нет (STATS-2).
        overdue_count: {type: integer, minimum: 0}
        by_problem_type:
          type: array
          items: {$ref: '#/components/schemas/StatsProblemType'}
        by_month:
          type: array
          items: {$ref: '#/components/schemas/StatsMonth'}
    StatsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StatsResponse'}
    ProblemType:
      type: object
      required: [id, name, is_active, sort_order]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, maxLength: 120}
        is_active: {type: boolean}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EquipmentType:
      type: object
      required: [id, name, is_active, sort_order]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, maxLength: 120}
        is_active: {type: boolean}
        sort_order: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DictionaryItemCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        is_active: {type: boolean, default: true}
        sort_order: {type: integer, default: 0}
    DictionaryItemUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        is_active: {type: boolean}
        sort_order: {type: integer}
    Holiday:
      type: object
      required: [id, date, created_at]
      properties:
        id: {type: integer, format: int64}
        date: {type: string, format: date}
        created_at: {type: string, format: date-time}
    HolidayCreateRequest:
      type: object
      required: [date]
      properties:
        date: {type: string, format: date}
    Settings:
      type: object
      required:
        [app_name, deadline_days, workdays, timezone, deadline_reminder_time,
         push_enabled, statuses]
      properties:
        app_name: {type: string, maxLength: 200}
        deadline_days:
          type: integer
          minimum: 1
          maximum: 30
          description: N рабочих дней для дедлайна (TICKET-3).
        workdays:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Workday'}
        timezone:
          type: string
          description: IANA-идентификатор (CAL-2).
          example: Asia/Yekaterinburg
        deadline_reminder_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '10:00'
        push_enabled: {type: boolean}
        statuses:
          type: array
          description: Названия и цвета 4 фиксированных статусов (TICKET-1).
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/StatusSetting'}
    StatusSetting:
      type: object
      required: [code, label, color]
      properties:
        code: {$ref: '#/components/schemas/TicketStatus'}
        label: {type: string, maxLength: 60}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#1677ff'
    SettingsUpdateRequest:
      type: object
      required:
        [app_name, deadline_days, workdays, timezone, deadline_reminder_time,
         push_enabled, statuses]
      properties:
        app_name: {type: string, minLength: 1, maxLength: 200}
        deadline_days: {type: integer, minimum: 1, maximum: 30}
        workdays:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Workday'}
        timezone: {type: string, example: Asia/Yekaterinburg}
        deadline_reminder_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        push_enabled: {type: boolean}
        statuses:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/StatusSetting'}
