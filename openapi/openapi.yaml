      security: [{bearerAuth: []}]
      responses:
        '200':
          $ref: '#/components/responses/OkPushPublicKey'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/push/subscriptions:
    post:
      tags: [Push]
      operationId: createPushSubscription
      summary: Сохранение push-подписки устройства
      description: |-
        NOTIF-1: `endpoint` уникален; получатели — только USER/ADMIN.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushSubscriptionRequest'}
      responses:
        '201':
          $ref: '#/components/responses/CreatedPushSubscription'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/push/subscriptions/{id}:
    delete:
      tags: [Push]
      operationId: deletePushSubscription
      summary: Отключение push-подписки
      description: |-
        NOTIF-5: удаление/деактивация своей подписки.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/admin/trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: Корзина
      description: |-
        TRASH-1: дата удаления, кто удалил, краткое описание; фильтр по типу.
      security: [{bearerAuth: []}]
      parameters:
        - name: type
          in: query
          required: true
          schema: {$ref: '#/components/schemas/TrashType'}
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          $ref: '#/components/responses/OkTrash'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/admin/trash/{type}/{id}/restore:
    post:
      tags: [Trash]
      operationId: restoreTrashItem
      summary: Восстановление из корзины
      description: |
        TRASH-2: заявка возвращается со статусом и зданием (деактивированное здание —
        с предупреждением); узел БЗ — только при живом родителе; оборудование — при живом
        складе; конфликт регистрационного номера → `409`.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/TypePath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/OkTrashRestore'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/admin/trash/{type}/{id}:
    delete:
      tags: [Trash]
      operationId: purgeTrashItem
      summary: Окончательное удаление
      description: |-
        TRASH-3: физическое удаление с комментариями и файлами, необратимо.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/TypePath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '428': {$ref: '#/components/responses/PasswordChangeRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /health:
    get:
      tags: [System]
      operationId: health
      summary: Liveness
      description: |-
        NFR-4: процесс жив; не проверяет БД.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OkHealth'
  /health/ready:
    get:
      tags: [System]
      operationId: readiness
      summary: Readiness
      description: |-
        NFR-4: `200`, если БД доступна, иначе `503`.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OkReadiness'
        '503':
          $ref: '#/components/responses/ServiceUnavailableReadiness'
  /docs:
    get:
      tags: [System]
      operationId: docs
      summary: Swagger UI
      description: HTML-страница Swagger UI, загружающая `/openapi.yaml`.
      security: []
      responses:
        '200':
          description: HTML-страница документации.
          content:
            text/html:
              schema: {type: string}
  /openapi.yaml:
    get:
      tags: [System]
      operationId: openapiDocument
      summary: OpenAPI-контракт
      description: Исходный `openapi.yaml`, отдаваемый API.
      security: []
      responses:
        '200':
          description: YAML-контракт.
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен JWT HS256 (TTL 15 минут) в заголовке `Authorization: Bearer <token>`.
        Получается через `POST /api/auth/login`, обновляется через `POST /api/auth/refresh`.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Идентификатор сущности.
      schema: {type: integer, format: int64, minimum: 1}
    TokenPath:
      name: token
      in: path
      required: true
      description: Токен доступа анонимной заявки (32 случайных байта base64url).
      schema: {type: string, minLength: 32, maxLength: 128}
    TypePath:
      name: type
      in: path
      required: true
      description: Тип сущности корзины.
      schema: {$ref: '#/components/schemas/TrashType'}
    PageQuery:
      name: page
      in: query
      description: Номер страницы (с 1).
      schema: {type: integer, minimum: 1, default: 1}
    SizeQuery:
      name: size
      in: query
      description: Размер страницы (не более 100).
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: httpOnly refresh-cookie (path=/api/auth, SameSite=Lax, 7 дней).
      schema: {type: string}
  responses:
    OkHealth:
      description: Процесс API доступен.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Health'}
    OkReadiness:
      description: Все зависимости доступны.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Readiness'}
    ServiceUnavailableReadiness:
      description: Сервис не готов (БД недоступна).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Readiness'}
    OkSession:
      description: Успешная аутентификация; refresh-токен установлен в httpOnly cookie.
      headers:
        Set-Cookie:
          description: |
            `refresh_token=<token>; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=604800`
            (в production — с `Secure`).
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    NoContent:
      description: Успешно, тело отсутствует.
    OkUser:
      description: Текущий пользователь.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    OkPublicBuildings:
      description: Активные здания со счётчиками незавершённых заявок.
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/PublicBuilding'}
    OkPublicTickets:
      description: Карточки заявок для публичного дашборда (без description и комментариев).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicTicketsResponse'}
    CreatedPublicTicket:
      description: Заявка создана; `access_token` выдаётся один раз.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicTicketCreateResponse'}
    OkPublicTicket:
      description: Карточка заявки по токену.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PublicTicketDetail'}
    CreatedComment:
      description: Комментарий создан.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TicketComment'}
    OkCommentList:
      description: Комментарии заявки.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommentListResponse'}
    OkTicketList:
