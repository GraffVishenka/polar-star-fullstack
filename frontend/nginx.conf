# SPA + проксирование API на сервис `api` (docker compose).
# TLS терминируется на внешнем reverse proxy (NFR-2, Web Push требует HTTPS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Медиа: фото до 10 МБ, видео до 200 МБ (Б3).
    client_max_body_size 210m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # Видео и Excel/Word не буферизуем целиком.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health-проверки бэкенда доступны через тот же вход.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
        proxy_set_header Host $host;
    }

    # --- Статика -----------------------------------------------------------
    # Хешированные ассеты Vite кэшируются надолго.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
