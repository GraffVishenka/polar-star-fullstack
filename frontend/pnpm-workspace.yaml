# Настройки pnpm 11 (ключи из package.json больше не читаются).
# esbuild и msw требуют postinstall для подготовки бинарника/воркера.
onlyBuiltDependencies:
  - esbuild
  - msw
# pnpm 11 по умолчанию переустанавливает зависимости перед каждым скриптом;
# в ограниченной песочнице это падает на ignored-builds. Ставим зависимости явно.
verifyDepsBeforeRun: false
strictDepBuilds: false
