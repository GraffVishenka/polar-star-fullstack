name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Go + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: polar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/polar?parseTime=true&multiStatements=true"
      TEST_DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/polar_test?parseTime=true&multiStatements=true"
      JWT_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      TZ: "Asia/Yekaterinburg"
      APP_ENV: "test"
      UPLOAD_DIR: "/tmp/uploads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: prepare databases
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS polar_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          go run ./cmd/api migrate
          DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/api migrate
      - name: tests
        run: |
          set +e
          go test ./... -count=1 -timeout 10m -json > /tmp/tests.json
          code=$?
          if [ $code -ne 0 ]; then
            echo "--- failing tests ---"
            grep '"Action":"fail"' /tmp/tests.json | head -15 || true
            echo "--- output of failing tests ---"
            python3 ../scripts/ci_test_report.py /tmp/tests.json
            exit $code
          fi

  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit tests
        run: pnpm test -- --run
      - name: build
        run: pnpm build

  # Б13: проверка контракта. Основная проверка — офлайн-валидатор (js-yaml из
  # зависимостей фронтенда), redocly запускается информационно.
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version
      - name: install
        run: pnpm install --frozen-lockfile
      - name: validate contract (offline)
        run: node ../scripts/validate_openapi.mjs
      - name: redocly lint (informational)
        continue-on-error: true
        run: npx --yes @redocly/cli@1 lint ../openapi/openapi.yaml

  # Б13: сборка Docker-образов без публикации (проверяет Dockerfile'ы и контекст).
  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: polar-star-service-api:ci
      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: polar-star-service-frontend:ci

  e2e:
    name: Frontend E2E (Playwright + MSW)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e (MSW, без backend)
        run: pnpm e2e
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
